app:
  replicas: 2
  image:
    imageTag: c1da93f
  resources:
    requests:
      cpu: "200m"
      memory: "96Mi"
    limits:
      cpu: "600m"
      memory: "192Mi"
  env:
    LOG_LEVEL: INFO
ingress:
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
externalSecrets:
  enabled: true
  data:
    - secretKey: FLASK_API_KEY
      remoteKey: production/flask/api-key
      
aws:
  region: "eu-north-1"
resourceQuota:
  enabled: true
  hard:
    requests.memory: 1Gi
    requests.cpu: 2
    limits.memory: 2Gi
    limits.cpu: 4

networkPolicy:
  enabled: true
  denyEgress: true
  allowedCidrs:
    - "10.0.18.0/24"
    - "10.0.19.0/24"
