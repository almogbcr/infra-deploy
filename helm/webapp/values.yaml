app:
  replicas: 1

  image:
    imageRepo: almogbcr/flask-app
    imagePullPolicy: IfNotPresent

  ports:
    containerPort: 5050

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  readinessProbe:
    httpGet:
      path: /health
      port: 5050
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  livenessProbe:
    httpGet:
      path: /health
      port: 5050
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  env:
    APP_ENV: "__NAMESPACE__"
    APP_MESSAGE: "Hello From __NAMESPACE__"
    LOG_LEVEL: INFO
  
  topologySpread:
    enabled: false
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor

  terminationGracePeriodSeconds: 60

  lifecycle:
    preStop:
      exec:
        command: ["sleep", "15"]

ingress:
  className: alb
  host: ""
  annotations:
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health

externalSecrets:
  enabled: false

aws:
  region: ""

resourceQuota:
  enabled: false

networkPolicy:
  enabled: false
  denyEgress: false
  allowedCidrs: []
