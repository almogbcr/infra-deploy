app:
  image:
    imageRepo: almogbcr/flask-app
    imagePullPolicy: IfNotPresent

  ports:
    containerPort: 5050

  readinessProbe:
    httpGet:
      path: /health
      port: 5050
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  livenessProbe:
    httpGet:
      path: /health
      port: 5050
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  env:
    APP_ENV: "__NAMESPACE__"
    APP_MESSAGE: "Hello From __NAMESPACE__"
    LOG_LEVEL: INFO

ingress:
  className: alb
  host: ""
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health

externalSecrets:
  enabled: false
aws:
  region: ""

resourceQuota:
  enabled: false
