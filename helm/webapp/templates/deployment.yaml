apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.app.replicas }}
  strategy:
    {{- toYaml .Values.app.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ .Release.Name}}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}

      serviceAccountName: {{ .Release.Name }}-{{ .Release.Namespace }}-sa

      {{- if .Values.app.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.app.topologySpread.maxSkew }}
          topologyKey: {{ .Values.app.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.app.topologySpread.whenUnsatisfiable }}
          nodeTaintsPolicy: {{ .Values.app.topologySpread.nodeTaintsPolicy }}
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}
      {{- end }}

      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.app.image.imageRepo }}@{{ required "app.image.imageDigest is required" .Values.app.image.imageDigest }}"
          imagePullPolicy: {{ .Values.app.image.imagePullPolicy  }}

          ports:
            - containerPort: {{ .Values.app.ports.containerPort }}

          lifecycle:
            {{- toYaml .Values.app.lifecycle | nindent 12 }}

          resources:
            {{- toYaml .Values.app.resources | nindent 12}}

          readinessProbe:
            {{- toYaml .Values.app.readinessProbe | nindent 12 }}

          livenessProbe:
            {{- toYaml .Values.app.livenessProbe | nindent 12 }}

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            {{- if .Values.externalSecrets.enabled }}
            - secretRef:
                name: {{ .Release.Name }}-secret
            {{- end }}
