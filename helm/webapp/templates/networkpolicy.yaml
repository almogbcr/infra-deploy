{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-network-policy
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.denyEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.app.ports.containerPort }}
  {{- if .Values.networkPolicy.denyEgress }}
  egress: []
  {{- end }}
{{- end }}