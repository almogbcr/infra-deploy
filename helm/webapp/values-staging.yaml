app:
  replicas: 1
  image:
    imageTag: cd755f4
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "600m"
      memory: "128Mi"
  
  env:
    LOG_LEVEL: INFO

ingress:
  annotations:
    alb.ingress.kubernetes.io/scheme: internal

externalSecrets:
  enabled: true
  data:
    - secretKey: FLASK_API_KEY
      remoteKey: staging/flask/api-key
      
aws:
  region: "eu-north-1"

resourceQuota:
  enabled: true
  hard:
    requests.memory: 512Mi
    requests.cpu: 1
    limits.memory: 1Gi
    limits.cpu: 2

networkPolicy:
  enabled: true
  denyEgress: true
  allowedCidrs:
    - "10.0.4.0/24"
    - "10.0.5.0/24"