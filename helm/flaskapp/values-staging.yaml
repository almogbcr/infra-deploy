app:
  replicas: 1
  image:
    imageTag: c3c0aa9
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "600m"
      memory: "128Mi"
  env:
    LOG_LEVEL: INFO
ingress:
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
externalSecrets:
  data:
    - secretKey: FLASK_API_KEY
      remoteKey: staging/flask/api-key
aws:
  region: ""
resourceQuota:
  enabled: true
  hard:
    requests.memory: 512Mi
    requests.cpu: 1
    limits.memory: 1Gi
    limits.cpu: 2
