flask:
  replicas: 1

  image:
    imageRepo: almogbcr/flask-app
    imageTag: 74c83ac
    imagePullPolicy: IfNotPresent
  
  ports: 
    containerPort: 5050

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  

  readinessProbe:
    httpGet:
      path: /health
      port: 5050
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  livenessProbe:
    httpGet:
      path: /health
      port: 5050
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  
  LOG_LEVEL: INFO
