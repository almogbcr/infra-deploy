app:
  replicas: 1
  image:
    imageTag: cd755f4
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "600m"
      memory: "128Mi"

  env:
    APP_ENV: "__NAMESPACE__"
    APP_MESSAGE: "Hello From __NAMESPACE__"
    LOG_LEVEL: DEBUG

ingress:
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    
externalSecrets:
  data:
    - secretKey: FLASK_API_KEY
      remoteKey: dev/flask/api-key
aws:
  region: ""

resourceQuota:
  enabled: true
  hard:
    requests.memory: 512Mi
    requests.cpu: 1
    limits.memory: 1Gi
    limits.cpu: 2