apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name}}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.app.image.imageRepo }}:{{ .Values.app.image.imageTag }}"
          imagePullPolicy: {{ .Values.app.image.imagePullPolicy  }}
          ports:
            - containerPort: {{ .Values.app.ports.containerPort }}

          resources:
            {{- toYaml .Values.app.resources | nindent 12}}

          readinessProbe:
            {{- toYaml .Values.app.readinessProbe | nindent 12 }}

          livenessProbe:
            {{- toYaml .Values.app.livenessProbe | nindent 12 }}

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            {{- if .Values.externalSecrets.enabled }}
            - secretRef:
                name: {{ .Release.Name }}-secret
            {{- end }}
