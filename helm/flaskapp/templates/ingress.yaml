apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: flask-ingress
spec:
  ingressClassName: flask-test
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.flask.ports.containerPort }}