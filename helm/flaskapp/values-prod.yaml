app:
  replicas: 2
  image:
    imageTag: c3c0aa9
  resources:
    requests:
      cpu: "200m"
      memory: "96Mi"
    limits:
      cpu: "600m"
      memory: "192Mi"
  env:
    LOG_LEVEL: INFO
ingress:
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
externalSecrets:
  data:
    - secretKey: FLASK_API_KEY
      remoteKey: production/flask/api-key
aws:
  region: ""
resourceQuota:
  enabled: true
  hard:
    requests.memory: 1Gi
    requests.cpu: 2
    limits.memory: 2Gi
    limits.cpu: 4
