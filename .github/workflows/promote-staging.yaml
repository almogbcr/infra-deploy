
name: Promote to Staging

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Approved main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Get Dev image tag
        id: dev_image
        uses: mikefarah/yq@v4.54.2
        with:
          cmd: yq -r '.app.image.imageTag' helm/webapp/values-dev.yaml

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ steps.dev_image.outputs.result }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{7,10}$ ]] || exit 1

      - name: Update Staging image tag
        uses: mikefarah/yq@v4.54.2
        env:
          IMAGE_TAG: ${{ steps.dev_image.outputs.result }}
        with:
          cmd: yq -i '.app.image.imageTag = strenv(IMAGE_TAG)' helm/webapp/values-staging.yaml

      - name: Commit Staging Tag
        env:
          IMAGE_TAG: ${{ steps.dev_image.outputs.result }}
        run: |
          FILE="helm/webapp/values-staging.yaml"

          if git diff --quiet -- "$FILE"; then
            echo "Staging already uses this image version"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git commit -m "chore: promote staging to ${IMAGE_TAG}"
          git push origin HEAD:main
