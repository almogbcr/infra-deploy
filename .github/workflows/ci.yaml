name: Flask CI Build and Deploy to Dev

on:
  push:
    branches:
      - dev
    paths:
    - 'app/**'
    - 'tests/**'
    - '.github/workflows/ci.yaml'
    - '!**/*.MD'
    - '!**/*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app}}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: check changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ github.ref }}
          predicate-quantifier: 'some-with-excludes'
          filters: |
            app:
              - 'app/**'
              - '!**/*.MD'
              - '!**/*.md'
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python for test
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: install tests dependencies
        run: |
          python -m pip install -r app/requirements.txt
          python -m pip install ruff pytest
      - name: check py lint
        run: ruff check --select F --ignore F401 app/ tests/    
      - name: run tests for flask
        run: python -m pytest -v tests/flask_test.py

  build: 
    needs: [changes, tests]
    if: github.ref == 'refs/heads/dev' && (needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Dockerhub Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Build Docker Image
        run: docker build -t flask-app:${{ env.SHORT_SHA }} ./app
      
      - name: Run Docker Container
        run: docker run -d --name flaskapp -p 5050:5050 flask-app:${{ env.SHORT_SHA }}

      - name: Check Flask Health
        run: |
            for i in {1..10}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5050/health || true)

            if [ "$status" = "200" ]; then
            echo "Health check passed - HTTP 200"
            exit 0
            fi

            echo "Flask not ready - HTTP $status"
            sleep 2
            done

            echo "Health check failed"
            docker logs flaskapp
            exit 1

      - name: Push Docker Image
        run: |
          docker tag flask-app:${{ env.SHORT_SHA }} ${{ vars.DOCKERHUB_USERNAME }}/flask-app:${{ env.SHORT_SHA }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/flask-app:${{ env.SHORT_SHA }}

      - name: Update Dev image tag
        if: github.ref == 'refs/heads/dev'
        uses: mikefarah/yq@a4330671f17776618660a419ab2531e4f4dc48b6 # v4.54.2
        with:
          cmd: yq -i '.app.image.imageTag = strenv(SHORT_SHA)' helm/webapp/values-dev.yaml

      - name: Commit and Push Dev image tag
        if: github.ref == 'refs/heads/dev'
        run: |
          FILE="helm/webapp/values-dev.yaml"

          if ! git diff --quiet -- "$FILE"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$FILE"
            git commit -m "ci: update dev image to ${SHORT_SHA}"
            git push origin HEAD:dev
          fi