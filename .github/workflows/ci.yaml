name: Flask CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/ci.yaml'
jobs:
  buildx:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: false
          load: true
          tags: flask-app:${{ env.SHORT_SHA }}
      
      - name: Run Docker Container
        run: docker run -d --name flaskapp -p 5050:5050 flask-app:${{ env.SHORT_SHA }}

      - name: Wait for Flask
        run: sleep 5

      - name: Check the deployed server URL
        uses: jtalk/url-health-check-action@v5
        with:
          url: http://127.0.0.1:5050/health
          max-attempts: 5
          retry-delay: 2s