apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/almogbcr/infra-deploy.git
    targetRevision: c456fe3f596391107bd344640b8c32f8746275b0
    path: helm/webapp
    helm:
      releaseName: webapp
      valueFiles:
        - values-staging.yaml
      parameters:
        - name: app.image.imageRepo
          value: almogbcr/flask-app
          forceString: true
        - name: app.image.imageDigest
          value: sha256:ba0190596b1426c0f108b147963f2fbbdd96c8475c86f35038bb59f6d60ae50f
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        elbv2.k8s.aws/pod-readiness-gate-inject: enabled
    syncOptions:
      - CreateNamespace=true
