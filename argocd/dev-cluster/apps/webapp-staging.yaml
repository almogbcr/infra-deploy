apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:almogbcr/infra-deploy.git
    targetRevision: main
    path: helm/flaskapp

    helm:
      releaseName: webapp
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true