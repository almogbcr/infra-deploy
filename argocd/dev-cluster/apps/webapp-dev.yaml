apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/almogbcr/infra-deploy.git
    targetRevision: c456fe3f596391107bd344640b8c32f8746275b0
    path: helm/webapp

    helm:
      releaseName: webapp
      valueFiles:
        - values-dev.yaml
      parameters:
        - name: app.image.imageRepo
          value: almogbcr/flask-app
          forceString: true
        - name: app.image.imageDigest
          value: "sha256:6e4f360218f8d10e12bfe24c0d760d79ae4ba506abff36aadbd824140e2a4cde"
          forceString: true

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        elbv2.k8s.aws/pod-readiness-gate-inject: enabled
    syncOptions:
      - CreateNamespace=true
