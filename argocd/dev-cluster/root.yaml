apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev-cluster
  namespace: argocd
spec:
  project: default
  
  source: 
    repoURL: https://github.com/almogbcr/infra-deploy.git
    targetRevision: main
    path: argocd/dev-cluster/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  syncPolicy:
    automated:
      selfHeal: true